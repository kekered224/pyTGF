[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyTGF"
version = "1.0.0"
description = "Python implementation of TGF (Terrain Gravity Field) software with Numba-accelerated kernels and Web UI"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "numba>=0.55",
    "rasterio>=1.3",
    "flask>=2.0",
    "pillow>=9.0",
]

[project.scripts]
pytgf = "pyTGF.main:main"
pytgf-web = "pyTGF.web.__main__:main"

[tool.setuptools.packages.find]
include = ["pyTGF*"]
